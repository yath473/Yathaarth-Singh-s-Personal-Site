name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:            # this job name is the required status check: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
